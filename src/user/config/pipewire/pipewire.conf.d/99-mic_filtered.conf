# generated by micctl — filter
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Mic Filtered"
            media.name       = "Mic Filtered"
            audio.rate       = 48000
            audio.channels   = 2
            audio.position   = [ FL FR ]
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = df
                        plugin = /usr/lib64/libdeep_filter_ladspa.so
                        label  = deep_filter_stereo
                        control = { "Attenuation Limit (dB)" = 48 }
                    }
                    {
                        type   = ladspa
                        name   = comp
                        plugin = /usr/lib64/ladspa/lsp-plugins-ladspa.so
                        label  = "http://lsp-plug.in/plugins/ladspa/compressor_stereo"
                        control = {
                            "Compression mode" = 2
                            "Ratio" = 2
                            "Attack threshold (G)" = 0.25
                            "Attack time (ms)" = 20
                            "Release time (ms)" = 180
                            "Makeup gain (G)" = 2.2
                            "Sidechain lookahead (ms)" = 5
                        }
                    }
                    {
                        type   = ladspa
                        name   = lim
                        plugin = /usr/lib64/ladspa/lsp-plugins-ladspa.so
                        label  = "http://lsp-plug.in/plugins/ladspa/limiter_stereo"
                        control = {
                            "Threshold (G)" = 0.79
                            "Lookahead (ms)" = 5
                        }
                    }
                ]
                links = [
                    { output = "df:Audio Out L" input = "comp:Input L" }
                    { output = "df:Audio Out R" input = "comp:Input R" }
                    { output = "comp:Output L"  input = "lim:Input L" }
                    { output = "comp:Output R"  input = "lim:Input R" }
                ]
            }
            capture.props = {
                node.name     = "mic_filtered_capture"
                node.passive  = true
                target.object = "alsa_input.usb-RODE_Microphones_RODE_NT-USB-00.analog-stereo"
            }
            playback.props = {
                node.name        = "mic_filtered"
                node.description = "Mic Filtered"
                media.class      = "Audio/Source"
                audio.rate       = 48000
            }
        }
    }
]
